services:

  postgres:
    image: postgres:17
    container_name: login_plans_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: login_plans
      POSTGRES_USER: login_plans
      POSTGRES_PASSWORD: login_plans_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U login_plans -d login_plans"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: login_plans_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: login_plans_app
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+asyncpg://login_plans:login_plans_dev_password@postgres:5432/login_plans
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      DEBUG: "false"

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/api/v1/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  prometheus:
    image: prom/prometheus:latest
    container_name: login_plans_prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'


volumes:
  postgres_data:
  redis_data:
  prometheus_data:
