[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "login-plans"
version = "0.1.0"
description = "Sistema avanzado de autenticacion y gestion de planes"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic-settings",
    "uvicorn",
    "watchfiles",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
