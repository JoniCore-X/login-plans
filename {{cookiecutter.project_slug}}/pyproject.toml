[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "{{cookiecutter.project_name}}"
version = "0.1.0"
description = "Sistema avanzado de autenticacion y gestion de planes"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "argon2-cffi",
    "asyncpg",
    "fastapi",
    "httpx",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "uvicorn",
    "watchfiles",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
    "mutmut",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require external infrastructure",
    "regression: critical existing behavior that must not break",
    "slow: tests that may take significant time",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/database/migrations/*",
    "app/main.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "app/database/migrations"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["app/database/migrations"]
