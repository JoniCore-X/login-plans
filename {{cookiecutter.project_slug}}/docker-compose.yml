services:

  postgres:
    image: postgres:17
    container_name: {{cookiecutter.project_slug}}_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: {{cookiecutter.project_slug}}
      POSTGRES_USER: {{cookiecutter.project_slug}}
      POSTGRES_PASSWORD: {{cookiecutter.project_slug}}_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U {{cookiecutter.project_slug}} -d {{cookiecutter.project_slug}}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: {{cookiecutter.project_slug}}_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: {{cookiecutter.project_slug}}_app
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+asyncpg://{{cookiecutter.project_slug}}:{{cookiecutter.project_slug}}_dev_password@postgres:5432/{{cookiecutter.project_slug}}
      REDIS_URL: redis://redis:6379/0
      OTLP_ENDPOINT: http://jaeger:4317
      ENABLE_TRACING: "true"
      APP_ENV: development
      DEBUG: "false"

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/api/v1/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: {{cookiecutter.project_slug}}_jaeger
    restart: unless-stopped

    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

    environment:
      COLLECTOR_OTLP_ENABLED: "true"


  prometheus:
    image: prom/prometheus:latest
    container_name: {{cookiecutter.project_slug}}_prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'


volumes:
  postgres_data:
  redis_data:
  prometheus_data:
