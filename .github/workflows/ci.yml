name: CI Pipeline - The Guardian

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: login_plans
          POSTGRES_PASSWORD: login_plans_dev_password
          POSTGRES_DB: login_plans_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type Check (MyPy)
        run: mypy app

      - name: Run Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://login_plans:login_plans_dev_password@localhost:5432/login_plans_test
        run: alembic upgrade head

      - name: Run Tests (Pytest)
        env:
          DATABASE_URL: postgresql+asyncpg://login_plans:login_plans_dev_password@localhost:5432/login_plans_test
        run: pytest -q --cov=app --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t login-plans:ci .
